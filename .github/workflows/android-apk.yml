name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name floosy .
      - run: flutter pub get
      # flutter create generates the default MyApp widget test, but this app uses FloosyApp.
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: floosy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
